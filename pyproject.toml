[project]
name = "dol-visas-database"
version = "0.2.0"
description = "Build a DuckDB database from DOL OFLC H-1B LCA and PERM disclosure files"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.5",
    "requests",
    "pyyaml",
    "pandas",
    "huggingface_hub",
    "datapond-build",
]

[tool.uv.sources]
datapond-build = { git = "https://github.com/datapond-db/datapond-build", rev = "ba9f7198a0aff3b604953b5f7bd612d15ef1755e" }
