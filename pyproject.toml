[project]
name = "dol-visas-database"
version = "0.2.0"
description = "Build a DuckDB database from DOL OFLC H-1B LCA and PERM disclosure files"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "requests",
    "pyyaml",
    "pandas",
    "huggingface_hub",
    "datapond-build",
]

[tool.uv.sources]
datapond-build = { git = "https://github.com/datapond-db/datapond-build", tag = "v0.1.0" }
